<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Reminder</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 1rem;
    }

    .card {
      width: min(420px, 100%);
      background: #1e293b;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      color: #38bdf8;
    }

    p {
      margin-bottom: 1rem;
    }

    input,
    button {
      font: inherit;
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: none;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 0.8rem;
    }

    button {
      width: 100%;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      margin-top: 1rem;
      min-height: 1.2em;
      color: #facc15;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Stop Scrolling. Start Studying.</h1>
    <p>Set a study reminder and get back to what matters.</p>
    <label for="minutes">Remind me in (minutes)</label>
    <input id="minutes" type="number" min="1" value="25" />
    <button id="setReminder" type="button">Set Reminder</button>
    <p id="status"></p>
  </main>

  <script>
    const button = document.getElementById('setReminder');
    const minutesInput = document.getElementById('minutes');
    const statusText = document.getElementById('status');
    let activeTimeout;

    button.addEventListener('click', () => {
      const minutes = Number(minutesInput.value);

      if (!Number.isInteger(minutes) || minutes <= 0) {
        statusText.textContent = 'Please enter a valid number of minutes.';
        return;
      }

      clearTimeout(activeTimeout);
      const milliseconds = minutes * 60 * 1000;
      const remindAt = new Date(Date.now() + milliseconds).toLocaleTimeString();

      statusText.textContent = `Reminder set for ${remindAt}. Focus now!`;

      activeTimeout = setTimeout(() => {
        statusText.textContent = 'Time to study now. Put your phone down and focus!';
        alert('Study reminder: Stop scrolling and start studying now.');
      }, milliseconds);
    });
  </script>
</body>
</html>
